<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>场景浏览 · Awesome 3D World</title>
    <link rel="icon" href="assets/mark.svg" />
    <link rel="stylesheet" href="assets/style.css" />
    <script src="assets/viewer.js" defer></script>
  </head>
  <body class="viewer-page">
    <header class="viewer-header">
      <a href="./">← 返回图鉴</a>
      <h1 id="viewer-title">三维场景</h1>
      <span class="viewer-meta" id="viewer-meta"></span>
      <div class="viewer-links">
        <a class="button ghost small" id="viewer-details" href="./"
          >来源与精度</a
        ><a class="button primary small" id="viewer-download" hidden
          >下载 HTML ↓</a
        >
      </div>
    </header>
    <main class="viewer-stage" id="viewer-stage" style="padding: 0">
      <div class="viewer-cover">
        <div>
          <span class="eyebrow" style="color: #c3cfad">EXPLORE A WORLD</span>
          <h2 id="viewer-name">正在读取场景…</h2>
          <p id="viewer-note">载入后可以旋转、缩放与游览。</p>
          <button class="button" id="load-scene" disabled>
            载入交互场景 ↗
          </button>
          <p>首次加载需要片刻 · 需要支持 WebGL 的浏览器</p>
        </div>
      </div>
    </main>
  </body>
</html>
